<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisabo | Add Expense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="theme-toggle">

<label for="theme-toggle" class="theme-switch">
    <span class="sun-icon">☀️</span>
    <span class="moon-icon">🌙</span>
    <span>Switch Theme</span>
</label>
<div class="app-layout">
    <aside class="sidebar">
        <a href="dashboard.html" class="brand-logo">
            <span class="logo-icon">H</span>
            hisabo<span class="logo-dot">.</span>
        </a>
        <p class="sidebar-label">MAIN MENU</p>
        <nav class="side-nav">
            <a href="dashboard.html" class="side-link">
                ◈ Dashboard
            </a>
            <a href="add-expense.html" class="side-link active">
                ＋ Add Expense
            </a>
            <a href="expenses.html" class="side-link">
                ▤ All Expenses
            </a>
        </nav>
        <p class="sidebar-label">ACCOUNT</p>
        <nav class="side-nav">
            <a href="index.html" class="side-link">
                ↪ Logout
            </a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <div>
                <p class="topbar-kicker">TRANSACTIONS</p>
                <h1>Add Expense</h1>
            </div>
            <div class="avatar">S</div>
        </header>
        <section class="page-intro">
            <span class="welcome-label">NEW TRANSACTION</span>
            <h2>Record your expense</h2>
            <p>
                Enter the details below to record a new expense.
            </p>
        </section>
        <!-- Expense entry form -->
        <section class="form-panel">
            <form class="app-form">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="expense-title">
                            Expense Title
                        </label>
                        <input
                            type="text"
                            id="expense-title"
                            name="expense-title"
                            class="field-control"
                            placeholder="e.g. Grocery Shopping"
                            required
                        >
                    </div>
                    <div class="input-group">
                        <label for="amount">
                            Amount (₹)
                        </label>
                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            class="field-control"
                            placeholder="Enter amount"
                            min="1"
                            step="0.01"
                            required
                        >
                    </div>
                    <div class="input-group">
                        <label for="category">
                            Category
                        </label>
                        <select
                            id="category"
                            name="category"
                            class="field-control"
                            required
                        >
                            <option value="">Select Category</option>
                            <option>Food & Dining</option>
                            <option>Transportation</option>
                            <option>Shopping</option>
                            <option>Entertainment</option>
                            <option>Education</option>
                            <option>Healthcare</option>
                            <option>Utilities</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="date">
                            Expense Date
                        </label>
                        <input
                            type="date"
                            id="date"
                            name="date"
                            class="field-control"
                            required
                        >
                    </div>
                    <div class="input-group">
                        <label for="payment">
                            Payment Method
                        </label>
                        <select
                            id="payment"
                            name="payment"
                            class="field-control"
                            required
                        >
                            <option value="">Select Payment Method</option>
                            <option>Cash</option>
                            <option>UPI</option>
                            <option>Debit Card</option>
                            <option>Credit Card</option>
                            <option>Net Banking</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="type">
                            Transaction Type
                        </label>
                        <select
                            id="type"
                            name="type"
                            class="field-control"
                            required
                        >
                            <option value="">Select Transaction Type</option>
                            <option>Expense</option>
                            <option>Income</option>
                        </select>
                    </div>
                    <div class="input-group full-width">
                        <label for="description">
                            Description
                        </label>
                        <textarea
                            id="description"
                            name="description"
                            class="field-control"
                            placeholder="Write a short description..."
                        ></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <a href="dashboard.html" class="outline-btn">
                        Cancel
                    </a>
                    <button type="submit" class="primary-btn">
                        Save Expense →
                    </button>
                </div>
            </form>
        </section>
        <footer class="page-footer">
            © 2026 Hisabo | Personal Expense Tracker
        </footer>
    </main>
</div>
</body>
</html>
